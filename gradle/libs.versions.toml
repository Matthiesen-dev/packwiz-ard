[versions]
kotlin = "2.2.20"
shadow = "9.3.1"
architectury-loom = "1.13-SNAPSHOT"
architectury-plugin = "3.4-SNAPSHOT"
minecraft = "1.21.1"
fabric-loader = "0.18.4"
fabric-api = "0.116.6+1.21.1"
neoforge = "21.1.234"
junit = "5.1.0"
publish = "0.35.0"
matthiesen_core = "2.0.0"
sponge-mixin = "0.8.5"
toml4j = "0.7.2"
forge-config-api-port = "21.1.6"
faststats = "0.31.0-pre4"
faststats-mc = "0.31.0-pre4+mc1.21.1"

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
architectury-loom = { id = "dev.architectury.loom", version.ref = "architectury-loom" }
architectury-plugin = { id = "architectury-plugin", version.ref = "architectury-plugin" }

[libraries]
publish = { group = "com.vanniktech", name = "gradle-maven-publish-plugin", version.ref = "publish" }
kotlin-gradle = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
architectury-loom = { group = "dev.architectury", name = "architectury-loom", version.ref = "architectury-loom" }
architectury-plugin = { group = "architectury-plugin", name = "architectury-plugin.gradle.plugin", version.ref = "architectury-plugin" }
shadow-gradle = { group = "com.gradleup.shadow", name = "shadow-gradle-plugin", version.ref = "shadow" }
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
minecraft-net = { group = "net.minecraft", name = "minecraft", version.ref = "minecraft" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
neoforge = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge" }
junit-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
matthiesen-core-common = { group = "dev.matthiesen", name = "matthiesen-core-common", version.ref = "matthiesen_core" }
matthiesen-core-fabric = { group = "dev.matthiesen", name = "matthiesen-core-fabric", version.ref = "matthiesen_core" }
matthiesen-core-neoforge = { group = "dev.matthiesen", name = "matthiesen-core-neoforge", version.ref = "matthiesen_core" }
sponge-mixin = { group = "org.spongepowered", name = "mixin", version.ref = "sponge-mixin" }
toml4j = { group = "com.moandjiezana.toml", name = "toml4j", version.ref = "toml4j" }
forge-config-api-port-common = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-common-neoforgeapi", version.ref = "forge-config-api-port" }
forge-config-api-port-fabric = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-fabric", version.ref = "forge-config-api-port" }
faststats-core = { group = "dev.faststats.metrics", name = "core", version.ref = "faststats" }
faststats-fabric = { group = "dev.faststats.metrics", name = "fabric", version.ref = "faststats-mc" }
faststats-neoforge = { group = "dev.faststats.metrics", name = "neoforge", version.ref = "faststats-mc" }

[bundles]
commonCompileOnly = ["sponge-mixin", "forge-config-api-port-common"]
commonImplementation = ["toml4j", "faststats-core"]
commonModImplementation = ["matthiesen-core-common"]

fabricModImplementation = ["fabric-loader", "fabric-api"]
fabricModImplementationNoTransitive = ["matthiesen-core-fabric"]
fabricModRuntimeOnly = ["forge-config-api-port-fabric", "faststats-fabric"]

neoforgeModImplementation = ["matthiesen-core-neoforge"]
neoforgeModRuntimeOnly = ["faststats-neoforge"]